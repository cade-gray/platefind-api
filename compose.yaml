# Local/dev stack for the PlateFind API.
# Production runs the published ghcr.io image via a compose file on the VPS
# (see readme.md → Deployment).
services:
  server:
    build:
      context: .
      target: final
    ports:
      - 4269:4269
    # Bring the container back up on crash and when the host reboots.
    restart: unless-stopped
    environment:
      - DB_HOST=host
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=dbname
      - DB_PORT=5432
      - DB_SSLMODE=disable
